[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger-core"
version = "0.1.0"
description = "Double-entry ledger for custodial balances with two-phase holds and drift-free balances."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "polycratia", email = "hey@polycratia.com" }]
keywords = ["ledger", "double-entry", "accounting", "balances", "custodial"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# cryptomoney is not published yet; until it is, install it from source:
# pip install "cryptomoney @ git+https://github.com/polycratia/cryptomoney"
crypto = ["cryptomoney>=0.1"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/polycratia/ledger-core"
Source = "https://github.com/polycratia/ledger-core"
Issues = "https://github.com/polycratia/ledger-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_core"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
